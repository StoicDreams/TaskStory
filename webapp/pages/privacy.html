<head>

	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-QX5XYHV99J"></script>
	<script>
		// Pages opened on this machine or another device on the home network load Web UI from the local MyFiCDN server and skip analytics.
		window.webuiLocal = /^(localhost|127\.0\.0\.1|\[::1\]|10(\.\d+){3}|192\.168(\.\d+){2}|172\.(1[6-9]|2\d|3[01])(\.\d+){2}|[\w-]+\.local)$/.test(location.hostname);
		if (!webuiLocal) {
			window.dataLayer = window.dataLayer || [];
			function gtag() { dataLayer.push(arguments); }
			gtag('js', new Date());
			gtag('config', 'G-QX5XYHV99J');
		}
	</script>
	<title>Task Story Privacy Policy</title>

	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="index, follow">
	<base href="/" />

		navigator.serviceWorker?.register('service-worker.min.js');
	</script>

	<link rel="dns-prefetch" href="https://cdn.myfi.ws" />
	<link rel="dns-prefetch" href="https://api.myfi.ws" />

	<link href="Logo.svg?v=ba729e8e27" rel="icon" type="image/svg+xml" sizes="any" />
	<link rel="manifest" href="app.webmanifest?v=bcbb931b5e">

	<script>
		// Web UI loads from the local MyFiCDN server (MyFiCDN/PowerShell/RunLocal.ps1) when the site runs locally (through /webui-cdn/ on
		// another device, which RunLocal.ps1 -Network passes on to it),
		// so framework changes show before they are published, and from cdn.myfi.ws everywhere else.
		window.webuiCdn = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) ? 'http://localhost:3180/' : webuiLocal ? '/webui-cdn/' : 'https://cdn.myfi.ws/';
		document.write('<link href="' + webuiCdn + 'css/webui.min.css" rel="stylesheet" />');
	</script>
	<link href="css/app.min.css?v=d5706ae157" rel="stylesheet" />
	<script>document.write('<script src="' + webuiCdn + 'webui/loader.min.js"></' + 'script>');</script>

	<!-- Prerendered pages from webapp_post_build prerender. Release builds copy them to the site root. -->

	<!--Web Worker-->
	<script type="module" src="main.js?v=cea15cbf4f"></script>
	<!--End Web Worker-->

<body>
	<webui-app-config src="appConfig.json"></webui-app-config>
	<webui-app data-removeclass=".nav|open;.shared|open">
		<div data-prerendered>

		</div>
		<webui-drawer slot="left" class="nav elevation-20" docked="true" data-state="slot|docked" data-moveable data-dockable>
			<webui-flex justify="center" slot="header">
				<webui-stoic-dreams-logo title="Task Story Logo" text="Task" text2="Story"></webui-stoic-dreams-logo>
			</webui-flex>
			<webui-nav routes="/nav.json" data-subscribe="app-nav-routes:setNavRoutes"></webui-nav>
		</webui-drawer>
		<webui-drawer slot="right" class="shared elevation-20" data-stopclick data-moveable data-state="slot">
		</webui-drawer>
		<header slot="header">
			<button aria-label="open navigation menu" data-toggleclass=".nav|open" class="elevation-10 pa-1 mx-1">
				<webui-icon icon="hamburger"></webui-icon>
			</button>
			<h1 data-subscribe="page-title:innerHTML">Task Story Privacy Policy</h1>
			<h2 data-subscribe="page-subtitle:innerHTML"></h2>
			<webui-flex grow></webui-flex>
			<webui-feedback title="Provide us your feedback" data-post="https://api.myfi.ws/feedback/new" data-json-name="message">
				<p>You can also come <a href="https://discord.gg/5X4YSDFdHD">chat with us on the Stoic Dreams discord server.</a></p>
			</webui-feedback>
			<webui-alerts title="View your notifications" data-title="My Alerts" data-toggleclass=".shared|open"></webui-alerts>
			<webui-myfi-info sign-in-label="Sign In">
				<template slot="panel-content">
					<webui-flex column gap="2">
						<webui-link href="/dashboard" icon="grid">My Dashboard</webui-link>
						<webui-link href="/account" icon="users">Profile and Teams</webui-link>
					</webui-flex>
				</template>
			</webui-myfi-info>
		</header>
		<noscript>Javascript is required to view this site</noscript>
		<webui-page-footer copyright="2016" company="Stoic Dreams">
			<webui-next-page theme="tertiary" data-subscribe="page-next-page"></webui-next-page>
			<webui-flex class="my-3" justify="center" wrap>
				<webui-link href="/about" icon="circle_exclamation|backing|bordered">About Task Story</webui-link>
				<webui-link href="/contact" icon="messages|fill|shade:tri">Contact Stoic Dreams</webui-link>
				<webui-link href="/privacy" icon="shield_exclamation|backing|bordered">Privacy</webui-link>
				<webui-link href="/terms" icon="handshake|fill|shade:tri">Terms & Conditions</webui-link>
			</webui-flex>
			<webui-stoic-social-links class="mb-2"></webui-stoic-social-links>
		</webui-page-footer>
	</webui-app>
</body>

</html>
